<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parasitology Quiz</title>
    <style>
        body { font-family: 'Khmer OS Battambang', Arial, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .quiz-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        .question { font-size: 1.2rem; margin-bottom: 20px; font-weight: bold; }
        .options-list { list-style: none; padding: 0; }
        .option-item { margin-bottom: 12px; }
        .option-btn { width: 100%; padding: 12px; text-align: left; border: 2px solid #bdc3c7; border-radius: 6px; background: #fff; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .option-btn:hover { background: #ecf0f1; border-color: #3498db; }
        .correct { background: #2ecc71 !important; color: white; border-color: #27ae60; }
        .incorrect { background: #e74c3c !important; color: white; border-color: #c0392b; }
        .score-section { text-align: center; font-size: 1.5rem; font-weight: bold; display: none; }
        .restart-btn { margin-top: 20px; padding: 12px 25px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .restart-btn:hover { background: #2980b9; }
        .progress { margin-bottom: 20px; color: #7f8c8d; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h2>វិញ្ញាសា បារ៉ាស៊ីតសាស្ត្រ (Parasitology)</h2>
    <div id="quiz-box">
        <div class="progress" id="progress-text">សំណួរទី 1 នៃ 25</div>
        <div class="question" id="question-text">Loading question...</div>
        <ul class="options-list" id="options-box"></ul>
    </div>
    
    <div class="score-section" id="score-box">
        <p>អ្នកទទួលបានពិន្ទុ: <span id="final-score">0</span> / 25</p>
        <button class="restart-btn" onclick="startQuiz()">ធ្វើវិញ្ញាសាសាឡើងវិញ (Restart)</button>
    </div>
</div>

<script>
    // 1. PLACE YOUR RAW GEMINI QUIZ DATA HERE (Add up to 25 or more questions)
    const quizData = [
        {
            question: "Which parasite is commonly known as the hookworm causing iron-deficiency anemia?",
            options: ["Ancylostoma duodenale", "Enterobius vermicularis", "Ascaris lumbricoides", "Giardia lamblia"],
            correct: "Ancylostoma duodenale"
        },
        {
            question: "What is the diagnostic stage of Enterobius vermicularis typically found via the cellophane tape method?",
            options: ["Asymmetrical eggs", "Rhabditiform larvae", "Cysts with 4 nuclei", "Trophozoites"],
            correct: "Asymmetrical eggs"
        },
        // Add all your remaining questions following the exact structure above...
    ];

    let shuffledQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    // 2. The Shuffling Function (Fisher-Yates Algorithm)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // 3. Initialize/Restart Quiz Logic
    function startQuiz() {
        document.getElementById("score-box").style.display = "none";
        document.getElementById("quiz-box").style.display = "block";
        
        // Deep clone and shuffle the entire question bank
        shuffledQuestions = shuffleArray(JSON.parse(JSON.stringify(quizData)));
        
        // Limit to top 25 questions if your data pool is larger
        shuffledQuestions = shuffledQuestions.slice(0, 25); 
        
        currentQuestionIndex = 0;
        score = 0;
        showQuestion();
    }

    // 4. Render Shuffled Question and Shuffled Options
    function showQuestion() {
        const qBox = document.getElementById("options-box");
        qBox.innerHTML = "";
        
        let currentQ = shuffledQuestions[currentQuestionIndex];
        document.getElementById("progress-text").innerText = `សំណួរទី ${currentQuestionIndex + 1} នៃ ${shuffledQuestions.length}`;
        document.getElementById("question-text").innerText = currentQ.question;

        // Shuffle choices dynamically right before rendering them
        let shuffledChoices = shuffleArray([...currentQ.options]);

        shuffledChoices.forEach(choice => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerHTML = `<button class="option-btn" onclick="checkAnswer(this, '${choice.replace(/'/g, "\\'")}')">${choice}</button>`;
            qBox.appendChild(li);
        });
    }

    // 5. Answer Validation System
    function checkAnswer(button, selectedAnswer) {
        let currentQ = shuffledQuestions[currentQuestionIndex];
        let buttons = document.querySelectorAll(".option-btn");
        
        // Disable choices immediately to prevent double-clicking
        buttons.forEach(btn => btn.disabled = true);

        if (selectedAnswer === currentQ.correct) {
            button.classList.add("correct");
            score++;
        } else {
            button.classList.add("incorrect");
            // Highlight the correct hidden answer so they learn
            buttons.forEach(btn => {
                if (btn.innerText === currentQ.correct) {
                    btn.classList.add("correct");
                }
            });
        }

        // Delay briefly so student can see the feedback before transitioning
        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                showQuestion();
            } else {
                showResults();
            }
        }, 1500);
    }

    function showResults() {
        document.getElementById("quiz-box").style.display = "none";
        document.getElementById("score-box").style.display = "block";
        document.getElementById("final-score").innerText = score;
    }

    // Run automatically upon page loading
    window.onload = startQuiz;
</script>

</body>
</html>
